name: Build OpenSCAD models

on:
  push:
    branches:
      - master
    paths:
      - 'scad/**'
      - '.github/workflows/build-scad.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Create output directory
        run: mkdir -p output

      - name: Build badge model
        run: openscad -o output/watermelon_badge-54mm.3mf scad/watermelon_badge.scad

      - name: Build lock pin model
        run: openscad -o output/watermelon_badge_lock-30mm.3mf scad/lock_pin.scad

      - name: Publish 3MF files to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: Latest generated 3MF artifacts for the watermelon badge.
          files: |
            output/*.3mf
          fail_on_unmatched_files: true
          make_latest: true
